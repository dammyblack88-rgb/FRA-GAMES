name: Core gameplay tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check browser MVP JavaScript syntax
        run: node --check mvp/game.js
      - name: Run dependency-free gameplay tests
        run: npm test
